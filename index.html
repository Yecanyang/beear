<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拉拉熊的回家計畫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- 請替換為您的 Apps Script 網址 -->
    <script>
        const GAS_URL = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec";
    </script>

    <!-- 頂部導覽列 -->
    <header class="bg-amber-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i data-lucide="package-check"></i> 拉拉熊的回家計畫
            </h1>
            <button onclick="fetchData()" class="bg-amber-700 hover:bg-amber-800 px-3 py-1.5 rounded-lg text-sm flex items-center gap-1 transition">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i> 重新整理
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- 數據統計區塊 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="text-slate-500 text-sm">總銷售額 (售價合計)</div>
                <div id="statTotalPrice" class="text-2xl font-bold text-slate-800 mt-1">$0</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="text-slate-500 text-sm">已收金額合計</div>
                <div id="statReceivedPrice" class="text-2xl font-bold text-emerald-600 mt-1">$0</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="text-slate-500 text-sm">未收金額合計</div>
                <div id="statUnpaidPrice" class="text-2xl font-bold text-rose-600 mt-1">$0</div>
            </div>
        </div>

        <!-- 頂部操作與篩選工具列 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-3 justify-between items-center">
            <div class="flex flex-wrap gap-2 items-center w-full sm:w-auto">
                <input type="text" id="searchInput" oninput="renderRecords()" placeholder="搜尋人名或商品名稱..." 
                       class="border border-slate-300 rounded-lg px-3 py-2 text-sm w-full sm:w-64 focus:ring-2 focus:ring-amber-500 outline-none">
                
                <select id="filterArrival" onchange="renderRecords()" class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-amber-500 outline-none">
                    <option value="ALL">全部訂購狀態</option>
                    <option value="未訂購">未訂購</option>
                    <option value="已訂購">已訂購</option>
                    <option value="已到貨">已到貨</option>
                </select>
            </div>

            <div class="flex gap-2 w-full sm:w-auto justify-end">
                <button id="batchDeleteBtn" onclick="batchDelete()" disabled class="bg-rose-500 hover:bg-rose-600 text-white px-3 py-2 rounded-lg text-sm disabled:opacity-50 transition flex items-center gap-1">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> 批量刪除
                </button>
                <button onclick="openRecordModal()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1">
                    <i data-lucide="plus"></i> 新增訂單
                </button>
            </div>
        </div>

        <!-- 工作表1：訂單明細表格 -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-100 border-b text-slate-600">
                    <tr>
                        <th class="p-3 text-center"><input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)"></th>
                        <th class="p-3 text-center">圖片</th>
                        <th class="p-3">日期</th>
                        <th class="p-3">人名</th>
                        <th class="p-3">商品名稱</th>
                        <th class="p-3">售價</th>
                        <th class="p-3">成本</th>
                        <th class="p-3">已收金額</th>
                        <th class="p-3">未收金額</th>
                        <th class="p-3 text-center">到貨狀態</th>
                        <th class="p-3 text-center">寄出狀態</th>
                        <th class="p-3">備註</th>
                        <th class="p-3 text-center">操作</th>
                    </tr>
                </thead>
                <tbody id="recordsTableBody" class="divide-y divide-slate-100">
                    <!-- 動態渲染列 -->
                </tbody>
            </table>
        </div>

        <!-- 工作表2：庫存管理區塊 -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
            <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                <i data-lucide="boxes" class="text-amber-600"></i> 商品庫存管理 (工作表2)
            </h2>
            <div id="stockContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                <!-- 動態渲染庫存卡片 -->
            </div>
        </div>

    </main>

    <!-- 新增/編輯訂單彈窗 Modal -->
    <div id="recordModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 space-y-4 shadow-xl">
            <h3 id="modalTitle" class="text-lg font-bold text-slate-800">新增訂單</h3>
            <form id="recordForm" onsubmit="handleFormSubmit(event)" class="space-y-3">
                <input type="hidden" id="formId">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-slate-500">日期</label>
                        <input type="date" id="formDate" required class="w-full border rounded p-2 text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500">人名</label>
                        <input type="text" id="formPerson" required class="w-full border rounded p-2 text-sm">
                    </div>
                </div>
                <div>
                    <label class="text-xs text-slate-500">商品名稱</label>
                    <input type="text" id="formProduct" required class="w-full border rounded p-2 text-sm">
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="text-xs text-slate-500">售價</label>
                        <input type="number" id="formPrice" min="0" required class="w-full border rounded p-2 text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500">成本</label>
                        <input type="number" id="formCost" min="0" class="w-full border rounded p-2 text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500">已收金額</label>
                        <input type="number" id="formReceived" min="0" class="w-full border rounded p-2 text-sm">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-slate-500">到貨狀態</label>
                        <select id="formArrivalStatus" class="w-full border rounded p-2 text-sm">
                            <option value="未訂購">未訂購</option>
                            <option value="已訂購">已訂購</option>
                            <option value="已到貨">已到貨</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-500">寄出狀態</label>
                        <select id="formShippingStatus" class="w-full border rounded p-2 text-sm">
                            <option value="未寄出">未寄出</option>
                            <option value="已寄出">已寄出</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="text-xs text-slate-500">圖片 URL 或 Base64</label>
                    <input type="text" id="formImageUrl" placeholder="https://..." class="w-full border rounded p-2 text-sm">
                </div>
                <div>
                    <label class="text-xs text-slate-500">備註</label>
                    <textarea id="formNotes" class="w-full border rounded p-2 text-sm" rows="2"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeRecordModal()" class="px-4 py-2 border rounded-lg text-sm">取消</button>
                    <button type="submit" class="px-4 py-2 bg-amber-600 text-white rounded-lg text-sm hover:bg-amber-700">儲存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 前端腳本邏輯 -->
    <script>
        let records = [];
        let stockData = {};

        // 頁面載入時讀取資料
        window.onload = () => {
            lucide.createIcons();
            fetchData();
        };

        // 1. 從後端獲取完整資料
        function fetchData() {
            fetch(GAS_URL)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        records = data.records || [];
                        stockData = data.stock || {};
                        renderRecords();
                        renderStock();
                    } else {
                        alert('載入失敗：' + data.message);
                    }
                })
                .catch(err => console.error('Fetch error:', err));
        }

        // 2. 渲染工作表1明細列表
        function renderRecords() {
            const tbody = document.getElementById('recordsTableBody');
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            const filterArrival = document.getElementById('filterArrival').value;
            tbody.innerHTML = '';

            let totalSum = 0, receivedSum = 0, unpaidSum = 0;

            const filtered = records.filter(r => {
                const matchesSearch = !search || r.person.toLowerCase().includes(search) || r.product.toLowerCase().includes(search);
                const matchesArrival = (filterArrival === 'ALL') || (r.arrivalStatus === filterArrival);
                return matchesSearch && matchesArrival;
            });

            filtered.forEach(r => {
                const price = Number(r.price) || 0;
                const received = Number(r.received) || 0;
                const unpaid = price - received;

                totalSum += price;
                receivedSum += received;
                unpaidSum += unpaid;

                const tr = document.createElement('tr');
                tr.className = "hover:bg-amber-50/50 transition border-b";
                tr.innerHTML = `
                    <td class="p-3 text-center">
                        <input type="checkbox" value="${r.id}" onchange="updateBatchDeleteBtn()" class="record-checkbox w-4 h-4 rounded text-amber-600">
                    </td>
                    <td class="p-2 text-center">
                        ${r.imageUrl ? `<img src="${r.imageUrl}" class="w-10 h-10 object-cover rounded mx-auto border cursor-pointer" onclick="window.open('${r.imageUrl}')">` : `<div class="w-10 h-10 bg-slate-100 rounded mx-auto flex items-center justify-center text-slate-300"><i data-lucide="image" class="w-4 h-4"></i></div>`}
                    </td>
                    <td class="p-3 text-slate-600 whitespace-nowrap">${r.date || ''}</td>
                    <td class="p-3 font-medium text-slate-800">${r.person || ''}</td>
                    <td class="p-3 text-slate-700">${r.product || ''}</td>
                    <td class="p-3">
                        <input type="number" min="0" value="${price}" onchange="updateRecordField('${r.id}', 'price', this.value)" class="w-20 border rounded px-1.5 py-0.5 text-sm bg-white">
                    </td>
                    <td class="p-3">
                        <input type="number" min="0" value="${r.cost || 0}" onchange="updateRecordField('${r.id}', 'cost', this.value)" class="w-20 border rounded px-1.5 py-0.5 text-sm bg-white">
                    </td>
                    <td class="p-3 text-emerald-600 font-medium">$${received}</td>
                    <td class="p-3 ${unpaid > 0 ? 'text-rose-600 font-semibold' : 'text-slate-400'}">$${unpaid}</td>
                    <td class="p-3 text-center">
                        <select onchange="updateRecordField('${r.id}', 'arrivalStatus', this.value)" class="border rounded px-2 py-1 text-xs bg-white focus:ring-1 focus:ring-amber-500">
                            <option value="未訂購" ${r.arrivalStatus === '未訂購' ? 'selected' : ''}>未訂購</option>
                            <option value="已訂購" ${r.arrivalStatus === '已訂購' ? 'selected' : ''}>已訂購</option>
                            <option value="已到貨" ${r.arrivalStatus === '已到貨' ? 'selected' : ''}>已到貨</option>
                        </select>
                    </td>
                    <td class="p-3 text-center">
                        <select onchange="updateRecordField('${r.id}', 'shippingStatus', this.value)" class="border rounded px-2 py-1 text-xs bg-white focus:ring-1 focus:ring-amber-500">
                            <option value="未寄出" ${r.shippingStatus === '未寄出' ? 'selected' : ''}>未寄出</option>
                            <option value="已寄出" ${r.shippingStatus === '已寄出' ? 'selected' : ''}>已寄出</option>
                        </select>
                    </td>
                    <td class="p-3 text-xs text-slate-500 max-w-[120px] truncate" title="${r.notes || ''}">${r.notes || '-'}</td>
                    <td class="p-3 text-center space-x-1 whitespace-nowrap">
                        <button onclick="editRecordModal('${r.id}')" class="text-amber-600 hover:text-amber-800 p-1"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                        <button onclick="deleteRecord('${r.id}')" class="text-rose-500 hover:text-rose-700 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('statTotalPrice').innerText = `$${totalSum}`;
            document.getElementById('statReceivedPrice').innerText = `$${receivedSum}`;
            document.getElementById('statUnpaidPrice').innerText = `$${unpaidSum}`;
            lucide.createIcons();
        }

        // 3. 即時寫入並同步狀態 (解決已訂購跳回未訂購的問題)
        function updateRecordField(id, field, value) {
            const item = records.find(r => String(r.id) === String(id));
            if (!item) return;

            // 立即更新本地記憶體中的陣列
            item[field] = value;
            if (field === 'price' || field === 'received') {
                item.unpaid = (Number(item.price) || 0) - (Number(item.received) || 0);
            }

            // 發送請求更新至 Google Apps Script
            fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'save', ...item })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status !== 'success') {
                    alert('儲存失敗：' + data.message);
                    fetchData();
                } else {
                    renderRecords();
                }
            })
            .catch(err => {
                console.error(err);
                alert('網路連線異常');
            });
        }

        // 4. 渲染工作表2庫存區塊
        function renderStock() {
            const container = document.getElementById('stockContainer');
            container.innerHTML = '';

            Object.keys(stockData).forEach(prod => {
                const info = stockData[prod];
                const div = document.createElement('div');
                div.className = "bg-slate-50 border rounded-lg p-3 space-y-1";
                div.innerHTML = `
                    <div class="font-medium text-slate-700 truncate">${prod}</div>
                    <div class="text-xs text-slate-500 flex justify-between">
                        <span>初始: ${info.initial}</span>
                        <span class="font-bold text-amber-600">剩餘: ${info.remaining}</span>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // 5. 新增/編輯 Modal 控制
        function openRecordModal() {
            document.getElementById('formId').value = Date.now().toString();
            document.getElementById('formDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('recordForm').reset();
            document.getElementById('modalTitle').innerText = '新增訂單';
            document.getElementById('recordModal').classList.remove('hidden');
            document.getElementById('recordModal').classList.add('flex');
        }

        function closeRecordModal() {
            document.getElementById('recordModal').classList.add('hidden');
            document.getElementById('recordModal').classList.remove('flex');
        }

        function editRecordModal(id) {
            const item = records.find(r => String(r.id) === String(id));
            if (!item) return;

            document.getElementById('formId').value = item.id;
            document.getElementById('formDate').value = item.date;
            document.getElementById('formPerson').value = item.person;
            document.getElementById('formProduct').value = item.product;
            document.getElementById('formPrice').value = item.price;
            document.getElementById('formCost').value = item.cost;
            document.getElementById('formReceived').value = item.received;
            document.getElementById('formArrivalStatus').value = item.arrivalStatus;
            document.getElementById('formShippingStatus').value = item.shippingStatus;
            document.getElementById('formImageUrl').value = item.imageUrl;
            document.getElementById('formNotes').value = item.notes;

            document.getElementById('modalTitle').innerText = '編輯訂單';
            document.getElementById('recordModal').classList.remove('hidden');
            document.getElementById('recordModal').classList.add('flex');
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const payload = {
                action: 'save',
                id: document.getElementById('formId').value,
                date: document.getElementById('formDate').value,
                person: document.getElementById('formPerson').value,
                product: document.getElementById('formProduct').value,
                price: Number(document.getElementById('formPrice').value) || 0,
                cost: Number(document.getElementById('formCost').value) || 0,
                received: Number(document.getElementById('formReceived').value) || 0,
                arrivalStatus: document.getElementById('formArrivalStatus').value,
                shippingStatus: document.getElementById('formShippingStatus').value,
                imageUrl: document.getElementById('formImageUrl').value,
                notes: document.getElementById('formNotes').value
            };

            fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    closeRecordModal();
                    fetchData();
                } else {
                    alert('失敗：' + data.message);
                }
            });
        }

        // 6. 刪除與全選邏輯
        function deleteRecord(id) {
            if (!confirm('確定刪除此筆記錄？')) return;
            fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'delete', id: id })
            }).then(() => fetchData());
        }

        function toggleSelectAll(master) {
            document.querySelectorAll('.record-checkbox').forEach(cb => cb.checked = master.checked);
            updateBatchDeleteBtn();
        }

        function updateBatchDeleteBtn() {
            const checkedCount = document.querySelectorAll('.record-checkbox:checked').length;
            document.getElementById('batchDeleteBtn').disabled = checkedCount === 0;
        }

        function batchDelete() {
            const selectedIds = Array.from(document.querySelectorAll('.record-checkbox:checked')).map(cb => cb.value);
            if (!selectedIds.length || !confirm(`確定刪除選取的 ${selectedIds.length} 筆記錄？`)) return;

            fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'batchDelete', ids: selectedIds })
            }).then(() => fetchData());
        }
    </script>
</body>
</html>
